<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paws & Buckles | Dog Collars</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #faf7f2;
            color: #333;
        }

        header {
            background: #3d5a4a;
            color: white;
            padding: 20px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 26px;
        }

        header button {
            background: white;
            color: #3d5a4a;
            border: none;
            padding: 10px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        .hero {
            text-align: center;
            padding: 60px 20px;
            background: #e8eee8;
        }

        .hero h2 {
            font-size: 42px;
            margin-bottom: 12px;
        }

        .hero p {
            font-size: 18px;
            color: #555;
        }

        .products {
            max-width: 1200px;
            margin: 50px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 25px;
        }

        .product {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .product-image {
            height: 210px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            background: #eee;
        }

        .product-info {
            padding: 20px;
        }

        .product-info h3 {
            margin-bottom: 8px;
        }

        .description {
            color: #666;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        select {
            width: 100%;
            padding: 9px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .add-button {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 7px;
            background: #3d5a4a;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        .add-button:hover {
            background: #2d4437;
        }

        /* Cart */

        .cart {
            position: fixed;
            right: -420px;
            top: 0;
            width: 400px;
            max-width: 95%;
            height: 100%;
            background: white;
            box-shadow: -5px 0 20px rgba(0,0,0,0.2);
            padding: 25px;
            transition: right 0.3s ease;
            z-index: 10;
            overflow-y: auto;
        }

        .cart.open {
            right: 0;
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        .close-cart {
            border: none;
            background: none;
            font-size: 25px;
            cursor: pointer;
        }

        .cart-item {
            border-bottom: 1px solid #ddd;
            padding: 15px 0;
        }

        .cart-item h4 {
            margin-bottom: 5px;
        }

        .cart-item small {
            color: #777;
        }

        .quantity {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .quantity button {
            width: 28px;
            height: 28px;
            border: none;
            background: #ddd;
            border-radius: 5px;
            cursor: pointer;
        }

        .remove {
            color: #c0392b;
            border: none;
            background: none;
            cursor: pointer;
            margin-top: 8px;
        }

        .cart-total {
            margin-top: 25px;
            font-size: 22px;
            font-weight: bold;
        }

        .checkout {
            width: 100%;
            margin-top: 15px;
            padding: 14px;
            background: #d18b47;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        footer {
            text-align: center;
            padding: 30px;
            background: #3d5a4a;
            color: white;
            margin-top: 50px;
        }

        @media (max-width: 600px) {
            .hero h2 {
                font-size: 32px;
            }

            .cart {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🐾 Paws & Buckles</h1>
    <button onclick="openCart()">
        🛒 Cart (<span id="cart-count">0</span>)
    </button>
</header>

<section class="hero">
    <h2>Stylish Collars for Happy Dogs</h2>
    <p>Comfortable, durable collars designed for every adventure.</p>
</section>

<main class="products" id="products"></main>

<!-- Shopping Cart -->

<aside class="cart" id="cart">

    <div class="cart-header">
        <h2>Your Cart</h2>
        <button class="close-cart" onclick="closeCart()">×</button>
    </div>

    <div id="cart-items"></div>

    <div class="cart-total">
        Total: $<span id="cart-total">0.00</span>
    </div>

    <button class="checkout" onclick="checkout()">
        Proceed to Checkout
    </button>

</aside>

<footer>
    <p>© 2026 Paws & Buckles — Made for dogs, loved by humans.</p>
</footer>


<script>

const products = [
    {
        id: 1,
        name: "Classic Green Collar",
        price: 18.99,
        description: "Soft nylon collar with a durable metal buckle.",
        emoji: "🐕",
        color: "#c9d8c5"
    },
    {
        id: 2,
        name: "Adventure Orange",
        price: 22.99,
        description: "Heavy-duty collar for hiking, camping and outdoor adventures.",
        emoji: "🐕‍🦺",
        color: "#f3c29b"
    },
    {
        id: 3,
        name: "Midnight Blue",
        price: 20.99,
        description: "Elegant blue collar with reflective stitching.",
        emoji: "🐶",
        color: "#b9c7dc"
    },
    {
        id: 4,
        name: "Rainbow Fun",
        price: 24.99,
        description: "Colorful adjustable collar for dogs with personality.",
        emoji: "🌈",
        color: "#e6c8dc"
    },
    {
        id: 5,
        name: "Leather Classic",
        price: 34.99,
        description: "Premium genuine-leather collar with brass hardware.",
        emoji: "🐕",
        color: "#d6b28c"
    },
    {
        id: 6,
        name: "Reflective Night",
        price: 26.99,
        description: "Highly visible reflective collar for evening walks.",
        emoji: "🌙",
        color: "#c5c5c5"
    }
];

let cart = [];


/* Display products */

function displayProducts() {

    const container = document.getElementById("products");

    container.innerHTML = products.map(product => `

        <div class="product">

            <div
                class="product-image"
                style="background:${product.color}"
            >
                ${product.emoji}
            </div>

            <div class="product-info">

                <h3>${product.name}</h3>

                <p class="description">
                    ${product.description}
                </p>

                <div class="price">
                    $${product.price.toFixed(2)}
                </div>

                <select id="size-${product.id}">
                    <option value="Small">Small</option>
                    <option value="Medium" selected>Medium</option>
                    <option value="Large">Large</option>
                    <option value="XL">XL</option>
                </select>

                <select id="color-${product.id}">
                    <option>Black</option>
                    <option>Blue</option>
                    <option>Green</option>
                    <option>Red</option>
                    <option>Orange</option>
                </select>

                <button
                    class="add-button"
                    onclick="addToCart(${product.id})"
                >
                    Add to Cart
                </button>

            </div>

        </div>

    `).join("");
}


/* Add product */

function addToCart(id) {

    const product = products.find(p => p.id === id);

    const size = document.getElementById(`size-${id}`).value;
    const color = document.getElementById(`color-${id}`).value;

    const existing = cart.find(item =>
        item.id === id &&
        item.size === size &&
        item.color === color
    );

    if (existing) {

        existing.quantity++;

    } else {

        cart.push({
            id: id,
            name: product.name,
            price: product.price,
            size: size,
            color: color,
            quantity: 1
        });

    }

    updateCart();
    openCart();
}


/* Update cart */

function updateCart() {

    const container = document.getElementById("cart-items");

    if (cart.length === 0) {

        container.innerHTML = "<p>Your cart is empty.</p>";

    } else {

        container.innerHTML = cart.map((item, index) => `

            <div class="cart-item">

                <h4>${item.name}</h4>

                <small>
                    Size: ${item.size}<br>
                    Color: ${item.color}
                </small>

                <p>
                    $${item.price.toFixed(2)}
                </p>

                <div class="quantity">

                    <button onclick="changeQuantity(${index}, -1)">
                        −
                    </button>

                    <span>${item.quantity}</span>

                    <button onclick="changeQuantity(${index}, 1)">
                        +
                    </button>

                </div>

                <button
                    class="remove"
                    onclick="removeItem(${index})"
                >
                    Remove
                </button>

            </div>

        `).join("");

    }

    const count = cart.reduce(
        (total, item) => total + item.quantity,
        0
    );

    const total = cart.reduce(
        (total, item) => total + item.price * item.quantity,
        0
    );

    document.getElementById("cart-count").textContent = count;

    document.getElementById("cart-total").textContent =
        total.toFixed(2);
}


/* Change quantity */

function changeQuantity(index, amount) {

    cart[index].quantity += amount;

    if (cart[index].quantity <= 0) {
        cart.splice(index, 1);
    }

    updateCart();
}


/* Remove item */

function removeItem(index) {

    cart.splice(index, 1);

    updateCart();
}


/* Open / close cart */

function openCart() {
    document.getElementById("cart").classList.add("open");
}

function closeCart() {
    document.getElementById("cart").classList.remove("open");
}


/* Checkout */

function checkout() {

    if (cart.length === 0) {
        alert("Your cart is empty!");
        return;
    }

    const total = cart.reduce(
        (sum, item) => sum + item.price * item.quantity,
        0
    );

    alert(
        `Thanks for shopping with Paws & Buckles!\n\n` +
        `Order total: $${total.toFixed(2)}\n\n` +
        `This demo does not process real payments.`
    );
}


/* Start store */

displayProducts();
updateCart();

</script>

</body>
</html>
